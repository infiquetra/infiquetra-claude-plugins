name: Capability
description: Complete end-to-end functionality for a hermes agent to deliver
title: "[CAPABILITY] "
labels: ["capability", "hermes-task", "needs-plan"]
body:
  - type: markdown
    attributes:
      value: |
        ## Capability
        A complete, deployable unit of functionality — end-to-end value
        delivery (typically 1-4 weeks of agent work, XS → L sizing). The
        hermes orchestrator plans the capability and dispatches to an
        agent when this card moves to "Ready" on the board. All required
        fields below must be filled before planning starts.

  # BEGIN generated:issue-contract-fields
  # GENERATED by tools/docs/gen_issue_contract.py from the issue_fields block in config/sdlc-schema.json -- do not edit this region by hand.
  # Re-run: python3 tools/docs/gen_issue_contract.py  (the contract attrs -- label/type/render/required -- are authoritative; description/placeholder/value author-chrome is preserved per template).
  - type: input
    id: objective
    attributes:
      label: Objective
      description: One sentence stating what the capability delivers.
      placeholder: Add schema validator that gates plan-review on structured card fields
    validations:
      required: true
  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: Why this matters + the end-state (distinct from the one-line Objective), so the agent can re-derive the right action when the plan no longer applies.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Out-of-scope / non-goals
      description: |
        Explicit list of things the agent MUST NOT do. If there are no non-goals,
        write "None" rather than leaving blank — the reviewer uses this list to
        reject scope-creep critiques.
      placeholder: |
        - Do NOT change the planner prompt in this card
        - Do NOT add new required fields beyond those in the plan spec
        - Do NOT gate on author allow-list in this card (separate work)
      value: '- '
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs inventory
      description: The countable inputs (files, IDs, endpoints, fixtures) confirmed to exist before step 1. Required for high-risk items.
    validations:
      required: false
  - type: textarea
    id: files_expected
    attributes:
      label: Files expected to change
      description: Path list, one per line. Planner verifies each parent directory exists.
      placeholder: |
        ansible/roles/hermes_orchestrator/files/card_validator.py
        ansible/roles/hermes_orchestrator/files/handlers.py
        ansible/roles/hermes_orchestrator/files/comment_formats/validator_failure_github.md
    validations:
      required: true
  - type: textarea
    id: tests_required
    attributes:
      label: Tests to add or update
      description: File path + test function name, OR "No new tests required" with a one-line rationale.
      placeholder: |
        tests/test_card_validator.py::test_accepts_fully_populated_card
        tests/test_card_validator.py::test_rejects_missing_acceptance_criteria
        tests/test_card_validator.py::test_skips_non_hermes_task_label
    validations:
      required: true
  - type: textarea
    id: failure_modes
    attributes:
      label: Failure modes / pre-mortem
      description: 'Pre-mortem table: condition -> pre-authorized response (do-instead, not a bare don''t). Required for high-risk items.'
    validations:
      required: false
  - type: textarea
    id: stop_conditions
    attributes:
      label: Stop conditions
      description: Explicit escalation triggers keyed to actions (when to stop and ask rather than proceed). Required for high-risk items.
    validations:
      required: false
  - type: textarea
    id: context_library_links
    attributes:
      label: Context library links
      description: |
        Deep-links into the project's long-running context-library repo
        (requirements, ADRs, coding standards, policy docs). Optional.

        Use labeled subsections so policy-dependent reviewers know which
        doc applies to each concern. Recognized labels (all optional —
        omit a label when the project has no link of that type):

          - architecture_decisions: ADRs / design decision records
          - coding_standards: project code-style / convention guide
          - dependency_policy: allowed / disallowed third-party deps
          - data_privacy_policy: data classification + PII handling
          - deprecation_policy: deprecated patterns / APIs
          - sli_slo_budget: performance / availability budgets

        Format each label on its own bullet:
            - <label>: <url1>, <url2>
            - <label>: _none_
        Use `_none_` when the project HAS a policy of that type but
        nothing applies to this card. Unlabeled lines pass through to
        the planner as free-form context.
      placeholder: |
        - architecture_decisions: https://github.com/infiquetra/blueprint/adr/042.md
        - coding_standards: _none_

        General references:
        - Design: ~/.claude/plans/as-i-understand-it-gentle-lamport.md
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / conventions
      description: Free-form. Pattern-to-follow hints, constraints, or context about why the card exists.
      placeholder: |
        - GitHub issue forms render fields as `### <Field Label>` headers — parse on those
        - Semantic checks: acceptance_criteria needs ≥1 `- [ ]` line; verification needs ≥1 fenced code block
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Testable checklist. Each item is something the reviewer will verify the plan addresses.
      placeholder: |
        - [ ] Validator runs on `projects_v2_item` webhook when status becomes Ready
        - [ ] Cards missing required fields get a `needs-author-action` label + failure comment
        - [ ] Cards passing validation transition to Planning and invoke the planner
        - [ ] Existing orchestrator tests pass
      value: '- [ ] '
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Exact commands the agent runs to prove success. Shell code block.
      placeholder: |
        cd ansible/roles/hermes_orchestrator/files
        pytest tests/test_card_validator.py -v
        pytest tests/test_handlers.py -v
      render: bash
    validations:
      required: true
  - type: textarea
    id: lifecycle_origin
    attributes:
      label: Lifecycle Origin
      description: Backpointer to the originating saga thread / plan doc. Auto-populated by the /handoff compile step; authors leave blank.
    validations:
      required: false
  # END generated:issue-contract-fields

  - type: dropdown
    id: capability_size
    attributes:
      label: Capability size (human planning hint)
      description: |
        Optional rough size estimate for human planning. Not consumed by the
        planner — it's only a sizing signal for the board.
      options:
        - "XS (< 1 week)"
        - "S (1 week)"
        - "M (1-2 weeks)"
        - "L (2-4 weeks)"
    validations:
      required: false
