name: CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
      - 'plugins/*/v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ${{ fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Issue-contract vendored parity (consumer-side gate)
        # KTD3: the mission-control plugin vendors the issue-contract DATA + shim
        # modules generated in infiquetra-sdlc. This stdlib-only gate recomputes
        # each vendored module's SHA256 and compares it to its pinned manifest,
        # so any drift in a vendored copy fails the PR. The pytest run below also
        # covers this (test_issue_contract_parity.py); the standalone step gives
        # a named, dependency-free signal.
        run: python3 plugins/mission-control/config/generated/check_issue_contract_parity.py

      - name: Run tests with coverage
        run: uv run python -m pytest -v --cov=plugins --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 5

  validate:
    name: Validate Plugins
    runs-on: ${{ fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Validate plugin manifests
        run: uv run python scripts/validate_plugins.py

      - name: Validate marketplace registry
        run: uv run python marketplace/validator/validate.py

      # #431: fail the build if a plugin script reaches into another plugin's owned
      # write-mutation surface (e.g. a deploy-lane script calling `gh issue`), per the
      # machine-checked ownership lanes in marketplace/ownership_lanes.json.
      - name: Validate ownership lanes
        run: uv run python scripts/check_ownership_lanes.py --verbose

      - name: Engine Registry
        run: uv run python plugins/saga/scripts/check_engine_registry.py

      - name: Engine Registry Conformance
        run: uv run python plugins/saga/scripts/engine_registry_conformance.py

      # #422: one shared rule-registry lint over every plugins/*/agents/*.md file --
      # frontmatter schema, model-vs-role-class tier audit, and the review-class
      # tool-scope floor. `effort:` absence is warn-only (--report prints it) and never
      # fails this step during the grace period.
      - name: Agent-file spec lint (frontmatter, role-class tiers, tool-scope floor)
        run: uv run python tools/agent_spec.py --report

      # #424 T9-F4-5: static lint over mission-control's own scripts/skills/
      # commands/agents docs for unguarded `gh` list calls (no cursor loop,
      # no --limit) or bare per_page REST fetches. No network required.
      - name: Mission-control pagination-completeness lint
        run: uv run python plugins/mission-control/scripts/check_pagination.py

      # #424 T9-F2-6: live-derived board schema census vs. the committed
      # snapshot. Requires a Projects-scoped `gh` token; this runner has
      # none, so the script prints an explicit SKIPPED line (never a silent
      # pass) rather than failing -- mirrors check_issue_contract_parity.py's
      # `--live` leg. Exit 0 covers both "in sync" and "skipped".
      - name: Board schema census drift check (best-effort, live-gated)
        run: uv run python plugins/mission-control/scripts/board_census.py --check

  release-surfaces:
    name: Release Surface Parity
    runs-on: ${{ fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # #429: marketplace.json is generated from each plugin's own plugin.json — this
      # is the baseline generator check, distinct from the pytest run so a baseline
      # regression against the live fleet fails with its own named signal.
      - name: marketplace.json matches plugin.json (generator --check)
        run: uv run python scripts/sync_marketplace.py --check

      - name: Tri-lock release-surface parity (plugin.json == marketplace == CHANGELOG)
        run: uv run python scripts/check_release_surface_parity.py

      - name: CHANGELOG heading grammar lint (fleet baseline)
        run: uv run python -m pytest tests/test_changelog_heading_lint.py -k fleet_baseline -v

      # PR-scoped: needs the PR's base ref, so it only runs on pull_request events —
      # a direct push to main has no "PR base" for the diff-aware bump comparison (KTD4).
      - name: Diff-aware release-surface bump guard
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$PR_BASE_SHA" --depth=1
          uv run python tools/release_surface_diff_guard.py --base-ref "$PR_BASE_SHA"

      # #659: the structural half of this lint runs unconditionally in the `lint` job. This is
      # the half that actually prevents recurrence — a journal entry ADDED by the branch must
      # sit in the newest date section. The drift that motivated the lint was invisible
      # structurally (headings stayed ordered; entries just accumulated under the oldest one),
      # so only a diff-scoped check catches it, and only a PR has a base to diff against.
      - name: Journal newest-first guard (new entries)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$PR_BASE_SHA" --depth=1
          uv run python scripts/lint_journal_order.py --base-ref "$PR_BASE_SHA"

  lint:
    name: Lint
    runs-on: ${{ fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff check
        run: uv run python -m ruff check .

      - name: Run ruff format check
        run: uv run python -m ruff format --check .

      # #458 T11-F2-8: AST-based test-shape lint — fail the build on a NEW test module that
      # imports/patches only a fake and never imports or exercises the real production module it
      # claims to cover. `--prod-module server` recognizes redis-channel's production code (imported
      # as the `server` package) as a real crossing. No import/execution, no network.
      - name: Test-shape lint (fake-only test suites)
        run: uv run python scripts/lint_test_shape.py tests plugins --prod-module server

      # #458 T11-F1-6: golden-fixture drift check. Advisory per the facet's advisory rollout — it
      # reports a deleted/mutated golden but never fails the build.
      - name: Golden-fixture drift check (advisory)
        run: uv run python scripts/check_fake_fixtures.py --check --advisory

      # #371: every gate site across plugins/saga + plugins/team-execution must declare its
      # machine-readable operator-absence contract (gate-record/gate-exempt markers in markdown,
      # a literal absence_behavior on every open_gate call). Legacy debt is pinned exact-count in
      # plugins/saga/scripts/gate_absence_baseline.json — surfaced, shrink-only, drift fails.
      - name: Gate operator-absence contract lint
        run: uv run python plugins/saga/scripts/lint_gate_absence_contract.py

      # #659: LEARNINGS.md and DECISIONS.md both declare newest-first and both had drifted —
      # 16 and 20 entries stranded below the oldest heading, four duplicated date headings, five
      # entries authored at `##` instead of `###`. Structural half: ordering, uniqueness, and
      # heading level. The new-entry half is PR-scoped and lives in the validate job.
      - name: Engineering-journal ordering lint
        run: uv run python scripts/lint_journal_order.py

      # #405: parse every tracked mermaid fence through mermaid.parse() headless.
      # Set up Node is a uses: step (gate coverage skip prefix). The check itself
      # is a run: step whose name must match scripts/gate.sh exactly.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json

      - name: Mermaid syntax check
        run: |
          npm ci --prefix scripts/mermaid
          uv run python scripts/check_mermaid.py

  type-check:
    name: Type Check
    runs-on: ${{ fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run python -m mypy plugins/ scripts/ tests/ --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ${{ fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run bandit security scan
        run: uv run python -m bandit -r plugins/ scripts/ tests/ tools/ -ll -f json -o bandit-report.json || true

      - name: Report security findings
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            cat bandit-report.json
          else
            echo "No bandit report generated"
          fi

  publish:
    name: Publish Plugin
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}
    needs: [tests, validate, lint, type-check, security]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Extract release information
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

          if [[ "$REF_NAME" == plugins/* ]]; then
            PLUGIN=$(echo "$REF_NAME" | cut -d'/' -f2)
            VERSION=$(echo "$REF_NAME" | cut -d'/' -f3)
            echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "type=plugin" >> "$GITHUB_OUTPUT"
            echo "Plugin release: $PLUGIN $VERSION"
          else
            VERSION="$REF_NAME"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "type=marketplace" >> "$GITHUB_OUTPUT"
            echo "Marketplace release: $VERSION"
          fi

      - name: Validate plugin before release
        if: steps.release.outputs.type == 'plugin'
        run: uv run python marketplace/validator/validate.py

      - name: Extract changelog
        id: changelog
        if: steps.release.outputs.type == 'plugin'
        env:
          PLUGIN_NAME: ${{ steps.release.outputs.plugin }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -f "plugins/$PLUGIN_NAME/CHANGELOG.md" ]; then
            CHANGELOG=$(sed -n "/## \[$RELEASE_VERSION\]/,/## \[/p" "plugins/$PLUGIN_NAME/CHANGELOG.md" | sed '$ d')
            echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "changelog=No changelog available" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.release.outputs.type == 'plugin' && format('{0} {1}', steps.release.outputs.plugin, steps.release.outputs.version) || format('Marketplace {0}', steps.release.outputs.version) }}
          body: |
            ${{ steps.release.outputs.type == 'plugin' && format('## {0} {1}', steps.release.outputs.plugin, steps.release.outputs.version) || format('## Infiquetra Plugin Marketplace {0}', steps.release.outputs.version) }}

            ${{ steps.changelog.outputs.changelog || 'See CHANGELOG.md for details.' }}

            ---

            ### Installation

            ```bash
            # Install from marketplace
            /plugin install ${{ steps.release.outputs.plugin }}
            ```

            ### Documentation
            - [Plugin README](https://github.com/infiquetra/infiquetra-claude-plugins/tree/main/plugins/${{ steps.release.outputs.plugin }})
            - [Marketplace Guide](https://github.com/infiquetra/infiquetra-claude-plugins/blob/main/docs/MARKETPLACE_GUIDE.md)
          draft: false
          prerelease: ${{ contains(steps.release.outputs.version, 'alpha') || contains(steps.release.outputs.version, 'beta') || contains(steps.release.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RELEASE_TYPE: ${{ steps.release.outputs.type }}
          PLUGIN_NAME: ${{ steps.release.outputs.plugin }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            python - <<'PY' > slack-payload.json
          import json
          import os

          release_type = os.environ["RELEASE_TYPE"]
          plugin_name = os.environ.get("PLUGIN_NAME", "")
          release_version = os.environ["RELEASE_VERSION"]
          ref_name = os.environ["REF_NAME"]
          if release_type == "plugin":
              message = f"New plugin release: {plugin_name} {release_version}"
          else:
              message = f"New marketplace release: {release_version}"

          print(json.dumps({
              "channel": "",
              "text": message,
              "attachments": [{
                  "color": "good",
                  "fields": [{
                      "title": "Release",
                      "value": ref_name,
                      "short": True,
                  }, {
                      "title": "Repository",
                      "value": "claude-plugins",
                      "short": True,
                  }],
              }],
          }))
          PY
            curl -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              --data @slack-payload.json
          else
            echo "SLACK_WEBHOOK not configured, skipping notification"
          fi

      - name: Update marketplace index
        if: steps.release.outputs.type == 'plugin'
        env:
          PLUGIN_NAME: ${{ steps.release.outputs.plugin }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Marketplace index update would happen here"
          echo "Plugin: $PLUGIN_NAME"
          echo "Version: $RELEASE_VERSION"
