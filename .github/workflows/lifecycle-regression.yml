name: Lifecycle Regression

# Owned by the repository's Saga maintainers. Exercise current production CLIs in isolated
# fixture repositories: plan conformance, immutable saga ticks/resume, and review artifacts.
# Scope and historical #428 scenario mapping: tests/lifecycle-fixture/README.md.
# This scheduled detection job remains separate from the required merge contexts in ci.yml.

on:
  schedule:
    # 06:43 UTC daily — off the top of the hour, offset from the 07:17 mutation canary.
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle-regression:
    name: Lifecycle Regression (fixture-repo scenarios)
    runs-on: ${{ fromJSON(vars.WORKFLOW_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run current lifecycle CLI scenarios and failure controls
        run: >
          uv run --frozen pytest tests/test_lifecycle_regression_harness.py --no-cov -v -rA
          --junitxml=lifecycle-regression-report.xml

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-regression-report
          path: lifecycle-regression-report.xml
          if-no-files-found: error
          retention-days: 7
