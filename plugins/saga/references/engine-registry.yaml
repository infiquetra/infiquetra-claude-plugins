# Saga external-engine capability registry (R1-R4).
#
# NON-TRANSPORT METADATA (issue #776 / KTD4). This file is capability and calibration data only.
# It is not a session-launch authority and cannot override the live Orchestrate/Herdr roster.
# Reviewer sessions launch only as named units in an Orchestrate run record.
#
# SEED DATA (2026-06-27), not a permanent ranking. This is current benchmark + practitioner
# evidence, tagged per row by source + corroboration strength. The architecture does not depend on
# any cell being eternally correct -- last_validated (R3) makes staleness visible, and the data is
# re-validated by use through /retro (R21), NOT by an automated measurement loop.
#
# cost_speed_rank is the KTD9 tie-break key: lower = cheaper+faster. It only breaks ties between
# variants that rate a requested capability EQUALLY (rating dominates first).
# Any variant may declare an optional positive `max_concurrent` lane override. Saga applies the
# override only to units explicitly routed to that exact engine/variant key.

capabilities:
  - code-generation
  - adversarial-review
  - second-opinion
  - debug
  - refactor
  - scaffold
  - long-form-writing
  - bulk-classification
  - structured-extraction
  - embedding

model_families:
  # GPT-5.6 capability guidance is official model positioning, while the concrete ratings below
  # remain provisional until /retro has enough exact-variant evidence to revalidate them.
  gpt-5.6-sol:
    capability_profile:
      adversarial-review: {rating: STRONG, note: "flagship complex coding and security reviewer"}
      refactor: {rating: MODERATE, note: "multi-file terminal-oriented"}
  gpt-5.6-terra:
    capability_profile:
      adversarial-review: {rating: MODERATE, note: "everyday reviewer; below Sol for complex judgment"}
      refactor: {rating: WEAK, note: "conservative until multi-file evidence accumulates"}
  gpt-5.6-luna:
    capability_profile:
      adversarial-review: {rating: WEAK, note: "clear repeatable review only; not a complex reviewer"}
      refactor: {rating: WEAK, note: "structured transformations preferred over open-ended refactors"}
  gpt-5.5:
    capability_profile:
      adversarial-review: {rating: STRONG, note: "top composite reasoning; repo-access verification"}
      refactor: {rating: MODERATE, note: "multi-file terminal-oriented"}

engines:
  # ---- Codex / GPT-5.6 (external marketplace plugin; codex CLI) -------------------------------
  # Sol is the flagship default; Terra and Luna are intentionally conservative provisional rows.
  - engine_id: codex
    variant: gpt-5.6-sol-high
    substrate: external
    egress_policy: networked
    trust_tier: advisory
    default_for_engine: true
    invocation:
      via: codex:delegate
      recipe: "codex exec -s read-only -m gpt-5.6-sol -c model_reasoning_effort=high"
      write_capable: false
      model: gpt-5.6-sol
      effort: high
      cli: codex
      auth:
        mode: files
        paths:
          - "~/.codex/auth.json"
          - "~/.codex/config.toml"
    context_window: 400000
    cost_speed_rank: 2
    cost_per_token: {input_usd: 0.000005, output_usd: 0.000015}
    cost_class: metered
    budget_ceiling_usd: 25.0
    latency_class: standard
    model_identity: gpt-5.6-sol
    last_validated: 2026-07-10
    receipt_emitter: codex-bridge
    capability_profile:
      code-generation: {rating: MODERATE, note: "multi-file refactor, structured-output fidelity"}
      second-opinion: {rating: MODERATE, note: "cross-family; refuter behavior still unmapped"}
      debug: {rating: MODERATE, note: "tool-orchestrated; give it tools to iterate"}
      scaffold: {rating: WEAK, note: "greenfield architecture is a caution area"}
      long-form-writing: {rating: WEAK, note: "route expert prose to Claude"}
    prompting_protocol:
      - "Run read-only when generating against the repo."
      - "Give it tools to iterate when debugging (quality drops in pure-chat mode)."
      - "Manage context actively; it does not self-manage."
      - "Reserve xhigh for the hardest tasks (cost multiplier)."
