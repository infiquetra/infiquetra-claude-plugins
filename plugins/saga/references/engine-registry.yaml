  # ---- Ollama Cloud / gpt-oss:120b (generic OpenAI-compatible HTTP bridge, R3/AC3') ------------
  # Base URL + auth verified against https://docs.ollama.com/api/openai-compatibility and
  # https://docs.ollama.com/cloud on 2026-07-06 (U3 authoring step, KTD3). Ratings held at or
  # below MODERATE and omit refactor/scaffold/long-form-writing so this row cannot outrank the
  # current by_capability winners (routing-stability regression, KTD3).
  - engine_id: ollama-cloud
    variant: gpt-oss-120b
    substrate: external
    egress_policy: networked
    trust_tier: advisory
    default_for_engine: true
    transport: http
    invocation:
      via: engine-bridge-http
      recipe: "POST https://ollama.com/v1/chat/completions (gpt-oss:120b)"
      write_capable: false
      base_url: "https://ollama.com/v1"
      model: "gpt-oss:120b"
      effort: default
      auth:
        mode: bearer
        key_env: OLLAMA_API_KEY
    context_window: 128000
    cost_speed_rank: 5                 # conservative seed rank -- ties always lose to rank 1-4
    cost_per_token: {input_usd: 0.0, output_usd: 0.0}
    cost_class: free
    latency_class: standard
    model_identity: gpt-oss-120b
    last_validated: 2026-07-06
    receipt_emitter: http-bridge
    capability_profile:
      code-generation: {rating: MODERATE, note: "$0-marginal subscription offload; seed rating, availability-gated smoke only"}
      debug: {rating: MODERATE, note: "seed rating pending live-dispatch corroboration"}
      second-opinion: {rating: WEAK, note: "seed rating; cheap cross-family sanity pass at most"}
      bulk-classification: {rating: STRONG, note: "local/Ollama-class batch classification lane"}
      structured-extraction: {rating: STRONG, note: "local/Ollama-class JSON/data extraction lane"}
    prompting_protocol:
      - "Resolve the bearer token from OLLAMA_API_KEY at request-build time only; never log it."
      - "Availability-gated: skip (never fail) when OLLAMA_API_KEY is absent or endpoint unreachable."
      - "Advisory only -- never a gate/verdict source (R6, {#external-engines-never-gatekeepers})."
    sources:
      - {claim: "OpenAI-compatible base URL https://ollama.com/v1; bearer auth via OLLAMA_API_KEY", url: "https://docs.ollama.com/api/openai-compatibility", date: 2026-07-06, tag: OFFICIAL, corroboration: STRONG}
      - {claim: "gpt-oss:120b is a current Ollama Cloud model id", url: "https://docs.ollama.com/cloud", date: 2026-07-06, tag: OFFICIAL, corroboration: MODERATE}

