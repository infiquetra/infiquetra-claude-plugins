# Data-authored defaults for lifecycle-stage external-engine offers.
#
# Repo-local `.saga/engine-prefs.json` preferences override these defaults. These
# values only choose the first offer shown or reused when no stored preference exists.
version: 1
defaults:
  unknown:
    intent: none
  mechanical:
    intent: offload
    model: sonnet
    effort: medium
  judgment:
    intent: second-opinion
    model: opus
    effort: high
stage_shape_defaults:
  ideate: judgment
  brainstorm: judgment
  doc-review: judgment
  code-review: judgment
